# The ruff, mypy and pytest hooks run the same commands as CI, using the
# tools installed by `pip install -e ".[dev]"`, so their versions always
# match the ones CI installs. Lint and type checks run on every commit, the
# test suite on every push.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy --strict
        entry: mypy --strict src
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
